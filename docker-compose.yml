services:
  postgres:
    image: postgres:16-alpine
    container_name: talentscope_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentscope}
      POSTGRES_DB: ${POSTGRES_DB:-talentscope}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-talentscope} -d ${POSTGRES_DB:-talentscope}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: talentscope_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: talentscope_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Переопределяем хосты для работы внутри Docker-сети
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: talentscope_worker
    command: python -m app.worker
    env_file:
      - .env
    environment:
      # Переопределяем хосты для работы внутри Docker-сети
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: